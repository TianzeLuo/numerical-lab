<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数值方法实验室 · 交互式数值分析</title>
<meta name="description" content="从浮点误差到偏微分方程：用可以动手的图形学习数值方法的原理、误差与适用边界。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3ed">
<link rel="icon" href="./viz/site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./viz/site/site.css">
<script>
  // 在样式生效前确定主题，避免深色模式下的白屏闪烁。
  (function () {
    try {
      var stored = localStorage.getItem("nl-theme");
      var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0b1014" : "#f5f3ed");
    } catch (error) {}
  })();
</script>
</head>
<body>
<div id="app">
  <div class="boot" role="status" aria-live="polite">
    <span class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="9" fill="currentColor" opacity=".1"/>
        <path d="M7 22.2c4.1-1.3 4.6-11.3 9-11.3s4.6 8.8 9 6.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="2.15" fill="currentColor"/>
      </svg>
    </span>
    <span class="boot-word">数值方法实验室</span>
  </div>
</div>
<noscript>
  <div class="noscript">这个实验室需要用 JavaScript 绘制交互图形。请在浏览器设置中启用 JavaScript 后刷新页面。</div>
</noscript>
<script type="module" src="./dist/viz/site/app.js"></script>
</body>
</html>
